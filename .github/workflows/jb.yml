name: build-and-deploy-jupyterbook
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deploy:
    name: Build Jupyter Book and Deploy to gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # Cache-Key inkl. requirements.txt UND _config.yml, damit Ext-Änderungen Cache busten
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '_config.yml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install sphinxcontrib-youtube sphinxcontrib-mermaid

      - name: Sanity check: extensions importable
        run: |
          python -c "import importlib,sys; \
          importlib.import_module('sphinxcontrib.youtube'); \
          importlib.import_module('sphinxcontrib.mermaid'); \
          print('OK: sphinxcontrib.youtube & sphinxcontrib.mermaid importable')"

      - name: Build book
        run: |
          jupyter-book --version
          jupyter-book clean .
          jupyter-book build .

      - name: Verify YouTube iframe present
        run: |
          if ! grep -R --include='*.html' -n '<iframe' _build/html; then
            echo 'No <iframe> found in built HTML (YouTube likely not rendered)';
            exit 1;
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html
